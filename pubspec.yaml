name: doctordesk
description: DoctorDesk Mobile App
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  geolocator: ^13.0.2
  google_fonts: ^6.1.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: ^6.3.0
  firebase_storage: ^13.5.0
  image_picker: ^1.1.2
  flutter_tts: ^4.2.2
  cloud_firestore: ^6.10.0
  dart_geohash: ^2.1.0
  youtube_player_flutter: ^9.1.1
  package_info_plus: ^8.3.0
  path_provider: ^2.1.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/dhaka_places.json
    - assets/data/

dependency_overrides:
  # youtube_player_flutter 9.x pulls in flutter_inappwebview 6.1.5, whose Android plugin
  # uses getDefaultProguardFile('proguard-android.txt'), which AGP 9 rejects.
  # 6.2.0-beta.3 is the first release with the fix; drop this once 6.2.0 is stable.
  flutter_inappwebview: 6.2.0-beta.3
